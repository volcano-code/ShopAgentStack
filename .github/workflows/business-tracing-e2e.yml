# Source capture is provenance only, not a business test result.
name: Business tracing E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-business-tracing-${{ github.ref }}
  cancel-in-progress: true
jobs:
  business:
    name: Browser approval to real application trace
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Unit tests for isolation and evidence rejection
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          python -m pytest tools/shop_e2e/tests -q
      - name: Build real Java applications with established regressions
        run: >-
          mvn -B -ntp -f services/commerce/pom.xml
          -Ddocker.skip=true -DskipTests=false
          '-Dtest=OrderOwnershipTest,CartPricingTest,AgentOperationTest,RefundServiceTest,ProductQueryServiceTest,SupportServiceTest,CatalogManagementServiceTest,FulfillmentServiceTest,CommerceTracingTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl mall-portal,mall-admin -am clean verify
      - name: Require executed Java tracing tests
        run: |
          mkdir -p .local/java-tracing
          git rev-parse HEAD HEAD^{tree} > .local/java-tracing/source.txt
          python -m tools.shop_quality.junit_gate --root services/commerce/shop-agent-stack-after-sale/target/surefire-reports --pattern TEST-com.macro.mall.shopagentstack.CommerceTracingTest.xml | tee .local/java-tracing/tests.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: java-tracing-tests
          path: .local/java-tracing/
          if-no-files-found: error
          retention-days: 7
      - name: Build real frontend and install locked Chromium
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          cd apps/web
          npm exec --no -- playwright install --with-deps chromium
      - name: Browser to real MCP Java RabbitMQ and independent MySQL readback
        run: python -m tools.shop_e2e run --tracing
      - name: Retry cleanup of only this owned disposable project
        if: always()
        run: python -m tools.shop_e2e cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: business-tracing-e2e
          path: .local/business-e2e/artifacts/
          retention-days: 7
          if-no-files-found: error
