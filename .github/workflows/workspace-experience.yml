name: Workspace experience
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record checkout provenance
        run: |
          mkdir -p .local/workspace-experience
          git rev-parse HEAD HEAD^{tree} > .local/workspace-experience/source.txt
          git ls-files -s -- apps/web .github/workflows/workspace-experience.yml >> .local/workspace-experience/source.txt
      - name: Locked build and transport contracts
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run test:unit
          npm --prefix apps/web run build
      - name: Record dependency advisory details (diagnostic, not a security pass)
        run: |
          set +e
          npm --prefix apps/web audit --json > .local/workspace-experience/npm-audit.json
          code=$?
          set -e
          test "$code" -eq 0 -o "$code" -eq 1
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path('.local/workspace-experience/npm-audit.json').read_text())
          assert 'metadata' in report and 'vulnerabilities' in report, 'Audit response unavailable'
          print(json.dumps(report['metadata']['vulnerabilities'], sort_keys=True))
          if report['metadata']['vulnerabilities'].get('high', 0) or report['metadata']['vulnerabilities'].get('critical', 0):
              print('::warning::Unresolved high/critical dependency advisories; artifact records details. No security clearance claimed.')
          PY
      - name: Browser interaction with synthetic APIs (no model calls)
        run: |
          cd apps/web
          npx --no-install playwright install --with-deps chromium
          npm run test:workspace
      - name: Require executed browser tests
        if: always()
        run: python -m tools.shop_quality.junit_gate --root .local/workspace-experience --pattern browser.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-experience
          path: |
            .local/workspace-experience/source.txt
            .local/workspace-experience/browser.xml
            .local/workspace-experience/npm-audit.json
            .local/workspace-experience/assistant-390.png
            .local/workspace-experience/assistant-1440.png
          if-no-files-found: error
          retention-days: 14
