name: Workspace experience
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record checkout provenance
        run: |
          mkdir -p .local/workspace-experience
          git rev-parse HEAD HEAD^{tree} > .local/workspace-experience/source.txt
          git ls-files -s -- apps/web .github/workflows/workspace-experience.yml >> .local/workspace-experience/source.txt
      - name: Locked build and transport contracts
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run test:unit
          npm --prefix apps/web run build
      - name: Block high/critical advisories and unavailable audit evidence
        run: >-
          python -m tools.shop_quality.npm_audit_gate
          --project apps/web --out .local/workspace-experience/dependency-audit
      - name: Browser interaction with synthetic APIs (no model calls)
        run: |
          cd apps/web
          npx --no-install playwright install --with-deps chromium
          npm run test:workspace
      - name: Require executed browser tests
        if: always()
        run: python -m tools.shop_quality.junit_gate --root .local/workspace-experience --pattern browser.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: workspace-experience
          path: |
            .local/workspace-experience/source.txt
            .local/workspace-experience/browser.xml
            .local/workspace-experience/dependency-audit/
            .local/workspace-experience/assistant-390.png
            .local/workspace-experience/assistant-1440.png
          if-no-files-found: error
          retention-days: 14
