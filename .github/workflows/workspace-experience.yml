name: Workspace experience
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-experience-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Record checkout provenance
        run: |
          mkdir -p .local/workspace-experience
          git rev-parse HEAD HEAD^{tree} > .local/workspace-experience/source.txt
          git ls-files -s -- apps/web .github/workflows/workspace-experience.yml >> .local/workspace-experience/source.txt
      - name: Locked build and transport contracts
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run test:unit
          npm --prefix apps/web run build
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 5ebbf627d6fa62302045b10452e8a87d6c45e774
          path: .local/bundle-baseline
          persist-credentials: false
      - name: Compare static entry closure against the fixed pre-split source
        run: |
          mkdir -p .local/frontend-delivery
          git -C .local/bundle-baseline rev-parse HEAD HEAD^{tree} > .local/frontend-delivery/baseline-source.txt
          npm --prefix .local/bundle-baseline/apps/web ci
          npm --prefix .local/bundle-baseline/apps/web run build -- --manifest
          node apps/web/scripts/bundle-budget.mjs --dist apps/web/dist --baseline-dist .local/bundle-baseline/apps/web/dist --out .local/frontend-delivery/bundle.json
      - name: Block high/critical advisories and unavailable audit evidence
        run: >-
          python -m tools.shop_quality.npm_audit_gate
          --project apps/web --out .local/workspace-experience/dependency-audit
      - name: Browser interaction with synthetic APIs (no model calls)
        run: |
          cd apps/web
          npx --no-install playwright install --with-deps chromium
          npm run test:workspace
      - name: Verify production lazy chunks and manual recovery (synthetic APIs)
        run: npm --prefix apps/web run test:delivery
      - name: Require executed production delivery tests
        if: always()
        run: python -m tools.shop_quality.junit_gate --root .local/frontend-delivery --pattern browser.xml
      - name: Require executed browser tests
        if: always()
        run: python -m tools.shop_quality.junit_gate --root .local/workspace-experience --pattern browser.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: workspace-experience
          path: |
            .local/workspace-experience/source.txt
            .local/frontend-delivery/baseline-source.txt
            .local/frontend-delivery/bundle.json
            .local/frontend-delivery/browser.xml
            .local/workspace-experience/browser.xml
            .local/workspace-experience/dependency-audit/
            .local/workspace-experience/assistant-390.png
            .local/workspace-experience/assistant-1440.png
          if-no-files-found: error
          retention-days: 14
