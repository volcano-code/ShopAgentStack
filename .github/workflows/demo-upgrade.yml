name: Demo version upgrade
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-demo-upgrade-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version-upgrade:
    name: Pinned BM25 upgrade and backup rollback
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check out the exact previous application version
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: e2a5310ec8a33f3078f796e8b7f2230c82fa2059
          path: .local/upgrade-baseline
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: |
            services/commerce/**/pom.xml
            .local/upgrade-baseline/services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            apps/web/package-lock.json
            .local/upgrade-baseline/apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test version admission, SQLite compatibility and recovery contracts
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          mkdir -p .local/upgrade-unit
          python -m pytest tools/shop_demo/tests/test_upgrade*.py tools/shop_demo/tests/test_backup.py tools/shop_demo/tests/test_backup_modes.py tools/shop_demo/tests/test_demo_runtime.py tools/shop_demo/tests/test_demo_state.py -q --junitxml=.local/upgrade-unit/TEST-upgrade.xml
          python -m tools.shop_quality.junit_gate --root .local/upgrade-unit
      - name: Build the pinned previous application through its own CLI
        working-directory: .local/upgrade-baseline
        run: python -m tools.shop_demo build
      - name: Build the current application through its own CLI
        run: python -m tools.shop_demo build
      - name: Upgrade real old data, then restore the original backup
        run: python -m tools.shop_demo.upgrade_smoke --baseline-checkout .local/upgrade-baseline
      - name: Cleanup only projects owned by this synthetic rehearsal
        if: always()
        run: python -m tools.shop_demo.upgrade_smoke --cleanup-only --baseline-checkout .local/upgrade-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: demo-version-upgrade-bm25
          path: |
            .local/upgrade-smoke/artifacts/evidence.json
            .local/upgrade-unit/TEST-upgrade.xml
          retention-days: 14
          if-no-files-found: error
