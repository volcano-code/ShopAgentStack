name: Admin review UI
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: admin-review-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        retrieval: [bm25, hybrid]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          overwrite-settings: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test private template snapshot contracts
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          mkdir -p .local/review-unit
          python -m pytest tools/shop_demo/tests tools/shop_e2e/tests -q --junitxml=.local/review-unit/tests.xml
          python -m tools.shop_quality.junit_gate --root .local/review-unit --pattern tests.xml
      - name: Build actual application through demo CLI
        run: python -m tools.shop_demo build
      - name: Require actual Java template tests
        run: python -m tools.shop_quality.junit_gate --root services/commerce --pattern '**/TEST-*DemoImportTemplateTest.xml'
      - name: Frontend contract tests and Chromium install
        run: |
          npm --prefix apps/web run test:unit
          cd apps/web
          npx --no-install playwright install --with-deps chromium
      - name: Browser interaction tests with explicit API doubles
        run: cd apps/web && npx --no-install playwright test --config=playwright.review.config.ts
      - name: Real browser to Java import and independent MySQL readback
        run: python -m tools.shop_demo.review_smoke --retrieval ${{ matrix.retrieval }}
      - name: Cleanup only this newly owned synthetic environment
        if: always()
        run: |
          python - <<'PY'
          from tools.shop_demo.state import ROOT, load
          from tools.shop_demo.runtime import destroy
          state = ROOT / '.local/review-smoke-${{ matrix.retrieval }}'
          if (state / 'manifest.json').is_file():
              owner, _ = load(ROOT, state)
              destroy(state, owner['project'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: admin-review-ui-${{ matrix.retrieval }}
          path: |
            .local/review-unit/tests.xml
            .local/review-ui/mock.xml
            .local/review-smoke-${{ matrix.retrieval }}/artifacts/evidence.json
            .local/review-smoke-${{ matrix.retrieval }}/artifacts/browser.xml
            .local/review-smoke-${{ matrix.retrieval }}/artifacts/mobile-review.png
            .local/review-smoke-${{ matrix.retrieval }}/artifacts/desktop-review.png
            services/commerce/**/target/surefire-reports/TEST-*DemoImportTemplateTest.xml
          if-no-files-found: error
          retention-days: 14
