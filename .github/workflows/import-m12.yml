name: Import verified ShopAgentStack source
on:
  push:
    branches: [feat/m1.2-integration]
    paths: [.bootstrap/READY]
permissions:
  contents: read
concurrency:
  group: shop-source-import
  cancel-in-progress: false
jobs:
  import:
    if: github.repository == 'volcano-code/ShopAgentStack'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the authorized destination at the triggering commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: destination
          persist-credentials: true
      - name: Check out only the fixed public source snapshot
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: GRIZ200005/shop-agent-stack
          ref: d2f57756672629492d194df3a5a03331b72bf37e
          path: upstream
          persist-credentials: false
      - name: Verify provenance, apply reviewed changes, and publish development branch
        shell: bash
        working-directory: destination
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: python3 .bootstrap/import_source.py --source ../upstream
