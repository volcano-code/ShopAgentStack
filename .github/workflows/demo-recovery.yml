name: Demo cold recovery
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-demo-recovery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cold-recovery:
    name: Cold backup and fresh BM25 restore
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test new launcher and unchanged disposable contracts
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          mkdir -p .local/demo-unit
          python -m pytest tools/shop_demo/tests tools/shop_e2e/tests -q --junitxml=.local/demo-unit/TEST-demo.xml
          python -m tools.shop_quality.junit_gate --root .local/demo-unit
      - name: Build through the actual demo CLI
        run: python -m tools.shop_demo build
      - name: Cold encrypted backup and restore to a new BM25 project
        run: python -m tools.shop_demo.backup_smoke
      - name: Cleanup only owned synthetic recovery projects
        if: always()
        run: |
          python - <<'PYEND'
          from tools.shop_demo.state import ROOT, load
          from tools.shop_demo.runtime import destroy
          for name in ('target', 'source'):
              state = ROOT / '.local/recovery-smoke' / name
              if (state / 'manifest.json').is_file():
                  owner, _ = load(ROOT, state)
                  destroy(state, owner['project'])
          PYEND
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: demo-recovery-bm25
          path: |
            .local/recovery-smoke/artifacts/evidence.json
            .local/demo-unit/TEST-demo.xml
          retention-days: 14
          if-no-files-found: error
