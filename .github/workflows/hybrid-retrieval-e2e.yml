# Real BGE CPU models + isolated Milvus; no external LLM or display-state mutation.
name: Hybrid retrieval E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-hybrid-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  hybrid:
    name: Real hybrid policy lifecycle and isolated business
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check pinned object store before expensive preparation
        run: |
          image=$(python -c 'from pathlib import Path; from tools.shop_e2e.stack import compose; p=Path.cwd(); print(compose(p,p/".local/preflight","shop-e2e-"+"0"*32,hybrid=True)["services"]["minio"]["image"])')
          docker pull "$image"
      - name: Unit tests for isolation and evidence rejection
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          python -m pytest tools/shop_e2e/tests -q
      - name: Build real Java applications with established regressions
        run: >-
          mvn -B -ntp -f services/commerce/pom.xml
          -Ddocker.skip=true -DskipTests=false
          '-Dtest=OrderOwnershipTest,CartPricingTest,AgentOperationTest,RefundServiceTest,ProductQueryServiceTest,SupportServiceTest,CatalogManagementServiceTest,FulfillmentServiceTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl mall-portal,mall-admin -am clean verify
      - name: Build real frontend and install locked Chromium
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          cd apps/web
          npm exec --no -- playwright install --with-deps chromium
      - name: Real BGE Milvus lifecycle, outage recovery, browser and MySQL evidence
        run: python -m tools.shop_e2e run --hybrid --state .local/hybrid-e2e
      - name: Retry cleanup of only this owned disposable project
        if: always()
        run: python -m tools.shop_e2e cleanup --state .local/hybrid-e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: hybrid-retrieval-e2e
          path: .local/hybrid-e2e/artifacts/
          retention-days: 7
          if-no-files-found: error
