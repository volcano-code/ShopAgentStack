name: Local demo smoke
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-local-demo-${{ github.ref }}
  cancel-in-progress: true
jobs:
  persistent-demo:
    name: Persistent demo (${{ matrix.retrieval }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        retrieval: [bm25, hybrid]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test new launcher and unchanged disposable contracts
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          mkdir -p .local/demo-unit
          python -m pytest tools/shop_demo/tests tools/shop_e2e/tests -q --junitxml=.local/demo-unit/TEST-demo.xml
          python -m tools.shop_quality.junit_gate --root .local/demo-unit
      - name: Build through the actual demo CLI
        run: python -m tools.shop_demo build
      - name: First start, stop, restart and persistent data readback
        run: python -m tools.shop_demo.smoke --retrieval '${{ matrix.retrieval }}'
      - name: Cleanup only this job's newly created demo
        if: always()
        env:
          DEMO_RETRIEVAL: ${{ matrix.retrieval }}
        run: |
          python - <<'PY'
          import os
          from tools.shop_demo.state import ROOT, load
          from tools.shop_demo.runtime import destroy
          state = ROOT / ('.local/demo-smoke-' + os.environ['DEMO_RETRIEVAL'])
          if (state / 'manifest.json').is_file():
              owner, _ = load(ROOT, state)
              destroy(state, owner['project'])
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: local-demo-${{ matrix.retrieval }}
          path: |
            .local/demo-smoke-${{ matrix.retrieval }}/artifacts/
            .local/demo-unit/TEST-demo.xml
          retention-days: 7
          if-no-files-found: error
