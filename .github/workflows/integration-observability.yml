# PR transport validation using real containers and synthetic spans; NOT commerce/LLM E2E.
name: Observability integration
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-obs-integration-${{ github.ref }}
  cancel-in-progress: false
jobs:
  collector-tempo:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: shopobsci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: deploy/observability/compose.yaml
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Private local configuration and parse check (do not print resolved secrets)
        run: |
          mkdir -p artifacts/observability
          python -m tools.shop_observability.local_env
          docker compose --env-file deploy/observability/.env config --quiet
          docker compose --env-file deploy/observability/.env run --rm --no-deps otel-collector validate --config=/etc/otelcol/config.yaml
      - name: Start actual Collector, Tempo, and Grafana
        run: docker compose --env-file deploy/observability/.env up -d
      - name: Check real health endpoints (do not assume a shell in distroless images)
        run: |
          ready=false
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:13133/ >/dev/null && curl -fsS http://127.0.0.1:13200/ready >/dev/null && curl -fsS http://127.0.0.1:13000/api/health >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          test "$ready" = true
      - name: Send OTLP then prove backend readback and privacy filtering
        run: python -m tools.shop_observability.collector_smoke --out artifacts/observability/smoke.json
      - name: Retain safe diagnostics only
        if: always()
        run: |
          docker compose --env-file deploy/observability/.env ps --all > artifacts/observability/compose-ps.txt
          docker compose --env-file deploy/observability/.env images --format json > artifacts/observability/images.json
          docker compose --env-file deploy/observability/.env logs --no-color otel-collector tempo > artifacts/observability/services.log
      - name: Remove only this run's isolated stack
        if: always()
        run: docker compose --env-file deploy/observability/.env down --remove-orphans
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: observability-integration
          path: artifacts/observability/
          retention-days: 7
          if-no-files-found: error
