# One-off, tightly scoped supply-chain repair for this same-repository PR.
# Never executes code from forks; changes only the known dependency lockfile.
name: Vite pinned lock refresh
on:
  pull_request:
    paths:
      - 'apps/web/package.json'
      - '.github/workflows/refresh-vite-lock.yml'
permissions:
  contents: write
jobs:
  regenerate-lock:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/m21-vite-audit-20261021'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: feat/m21-vite-audit-20261021
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Resolve one exact patched Vite release without installing or executing packages
        working-directory: apps/web
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund --save-dev --save-exact vite@8.3.4
          node -e "const m=require('./package.json'),l=require('./package-lock.json');if(m.devDependencies.vite!=='8.3.4'||l.packages['node_modules/vite'].version!=='8.3.4'||l.packages[''].devDependencies.vite!=='8.3.4')process.exit(1)"
      - name: Reject changes outside explicit lockfile and manifest
        run: |
          git diff --name-only | grep -vE '^apps/web/(package.json|package-lock.json)$' | (! grep .)
          git diff --quiet -- apps/web/package.json
      - name: Commit the lockfile only to this private feature branch
        run: |
          git add apps/web/package-lock.json
          git diff --cached --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "security(web): refresh pinned Vite 8.3.4 lockfile"
          git push origin HEAD:refs/heads/feat/m21-vite-audit-20261021
