# Source capture is provenance only, not a business test result.
name: Business E2E
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shop-business-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source:
    name: Source provenance (not E2E acceptance)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Archive tracked source only
        shell: bash
        run: |
          mkdir -p artifacts/source
          git rev-parse HEAD HEAD^{tree} > artifacts/source/source.txt
          git ls-files -s > artifacts/source/tree.txt
          git archive --format=zip --output=artifacts/source/source.zip HEAD
          sha256sum artifacts/source/source.zip > artifacts/source/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: business-source
          path: artifacts/source/
          retention-days: 7
          if-no-files-found: error
  business:
    name: Isolated browser and refund ledger
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: services/commerce/**/pom.xml
          overwrite-settings: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Unit tests for isolation and evidence rejection
        run: |
          python -m pip install -r tools/shop_quality/requirements-test.txt
          python -m pytest tools/shop_e2e/tests -q
      - name: Build real Java applications with established regressions
        run: >-
          mvn -B -ntp -f services/commerce/pom.xml
          -Ddocker.skip=true -DskipTests=false
          '-Dtest=OrderOwnershipTest,CartPricingTest,AgentOperationTest,RefundServiceTest,ProductQueryServiceTest,SupportServiceTest,CatalogManagementServiceTest,FulfillmentServiceTest'
          -Dsurefire.failIfNoSpecifiedTests=false
          -pl mall-portal,mall-admin -am clean verify
      - name: Build real frontend and install locked Chromium
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web run build
          cd apps/web
          npm exec --no -- playwright install --with-deps chromium
      - name: Browser to real MCP Java RabbitMQ and independent MySQL readback
        run: python -m tools.shop_e2e run
      - name: Retry cleanup of only this owned disposable project
        if: always()
        run: python -m tools.shop_e2e cleanup
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: business-e2e
          path: .local/business-e2e/artifacts/
          retention-days: 7
          if-no-files-found: error
